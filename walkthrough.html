<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santorini Chic 3D</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6f3ee; --ink2:rgba(246,243,238,.72); --ink3:rgba(246,243,238,.5);
  --glass:rgba(28,27,25,.34); --line:rgba(255,255,255,.18); --accent:#d9b88f;
}
html,body{margin:0;background:#0f0f0e;color:var(--ink);font-family:'Noto Sans JP','Hiragino Sans',sans-serif;}
body{overflow-x:hidden;}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;touch-action:pan-y;}
#grain{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2;opacity:.05;mix-blend-mode:soft-light;}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%);}
#scroller{position:relative;z-index:3;pointer-events:none;}
.ch{height:100vh;}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));}
#top b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:17px;letter-spacing:.16em;color:var(--ink);text-transform:none;}
#top .r{display:flex;gap:8px;align-items:center;}
.chip{white-space:nowrap;pointer-events:auto;border:1px solid var(--line);background:rgba(20,20,19,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--ink2);border-radius:999px;padding:7px 13px;font-size:11px;letter-spacing:.08em;cursor:pointer;font-family:inherit;}
.chip.on{background:rgba(246,243,238,.92);color:#1b1a18;border-color:transparent;}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
/* card */
#card{position:fixed;left:44px;bottom:64px;z-index:4;width:min(400px,calc(100vw - 32px));box-sizing:border-box;
  padding:24px 26px 22px;border-radius:18px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
  box-shadow:0 20px 60px rgba(0,0,0,.25);transition:opacity .6s ease,transform .6s ease;}
#card.hide{opacity:0;transform:translateY(14px);}
#card .no{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--accent);letter-spacing:.06em;}
#card h2{font-family:'Cormorant Garamond','Noto Sans JP',serif;font-weight:500;font-size:34px;line-height:1.1;margin:4px 0 2px;letter-spacing:.02em;text-wrap:balance;}
#card .jp{font-size:13px;color:var(--ink2);letter-spacing:.12em;margin-bottom:12px;}
#card p{font-size:13px;line-height:1.85;color:var(--ink2);margin:0 0 10px;font-weight:300;}
#card ul{margin:0;padding:0;list-style:none;font-size:12px;color:var(--ink2);line-height:1.8;}
#card li{display:flex;gap:8px;}
#card li::before{content:'';flex:none;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:.72em;}
#card li.pick{color:var(--ink);}
/* progress */
#rail{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:12px;}
#rail button{pointer-events:auto;width:9px;height:9px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:transparent;cursor:pointer;position:relative;}
#rail button.on{background:var(--ink);border-color:var(--ink);}
#rail button span{position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;color:var(--ink2);opacity:0;transition:.25s;letter-spacing:.06em;}
#rail button:hover span,#rail button.on span{opacity:1;}
#bar{position:fixed;left:0;bottom:0;height:2px;width:0;background:var(--accent);z-index:5;}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;font-size:11px;letter-spacing:.2em;color:var(--ink3);transition:opacity .6s;}
/* intro */
#intro{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#0f0f0e;transition:opacity 1.2s ease;}
#intro.gone{opacity:0;pointer-events:none;}
#intro h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(34px,6vw,72px);letter-spacing:.14em;margin:0;}
#intro div{font-size:12px;letter-spacing:.3em;color:var(--ink3);}
#title{position:fixed;left:0;right:0;top:34%;z-index:4;text-align:center;transition:opacity .8s;pointer-events:none;}
#title h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(40px,7vw,96px);letter-spacing:.12em;margin:0;text-shadow:0 4px 40px rgba(0,0,0,.35);}
#title div{font-size:12px;letter-spacing:.34em;color:var(--ink2);margin-top:8px;}
@media (max-width:760px){
  #top{padding:12px 12px;} #top .lbl{display:none;} #top b{font-size:14px;white-space:nowrap;}
  #top .r{gap:5px;} .chip{padding:6px 9px;font-size:10.5px;}
  #card{left:16px;right:16px;bottom:44px;width:auto;padding:18px 18px 16px;}
  #card h2{font-size:26px;} #card p{font-size:12px;} #card ul{font-size:11px;}
  #rail{right:10px;} #rail button span{display:none;}
}
@media (prefers-reduced-motion:reduce){#card,#intro,#title{transition:none;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="grain"></canvas>
<div id="vig"></div>
<div id="intro"><h1>SANTORINI CHIC</h1><div>LOADING THE ROOM</div></div>
<header id="top">
  <div><b>Santorini Chic</b> <span class="lbl">&nbsp;·&nbsp; 2LDK Walkthrough</span></div>
  <div class="r">
    <button class="chip on" data-t="13">昼</button>
    <button class="chip" data-t="17.6">夕景</button>
    <button class="chip" data-t="20.5">夜</button>
    <button class="chip" id="play">▶ 自動再生</button>
  </div>
</header>
<div id="title"><h1>Santorini Chic</h1><div>SCROLL TO WALK THROUGH THE ROOM</div></div>
<aside id="card" class="hide" aria-live="polite"></aside>
<nav id="rail" aria-label="シーン"></nav>
<div id="bar"></div>
<div id="hint">SCROLL ↓ ・ ドラッグで見回す</div>
<main id="scroller"></main>

function buildWavePendant(){const g=new THREE.Group();
  const y=1.62, len=1.3;
  const black=M(0x1c1c1c,0.45,0.3);
  // 吊りワイヤー2本
  cyl(g,black,0.003,0.003,H-y,-len*0.32,(H+y)/2,0,6);
  cyl(g,black,0.003,0.003,H-y,len*0.32,(H+y)/2,0,6);
  cyl(g,black,0.04,0.04,0.012,-len*0.32,H-0.006,0,16);
  cyl(g,black,0.04,0.04,0.012,len*0.32,H-0.006,0,16);
  // 直線のバー
  part(g,black,len,0.012,0.012,0,y,0);
  // 波打つリボン(外側ブラック・内側発光)
  const pts=[];
  for(let i=0;i<=60;i++){const t=i/60;
    const x=(t-0.5)*len*1.04;
    const yy=y-0.02+Math.sin(t*Math.PI*2.4+0.3)*0.09*(0.6+0.4*Math.sin(t*Math.PI));
    const z=Math.cos(t*Math.PI*2.4+0.3)*0.025;
    pts.push(new THREE.Vector3(x,yy,z));}
  const curve=new THREE.CatmullRomCurve3(pts);
  const rib=new THREE.Mesh(new THREE.TubeGeometry(curve,160,0.011,8,false),black); g.add(rib);
  const glow=glowMat(0xffd9a6);
  const gl=new THREE.Mesh(new THREE.TubeGeometry(curve,160,0.0075,8,false),glow);
  gl.position.y=-0.007; g.add(gl);
  const sp=new THREE.SpotLight(0xffd6a0,0,6,0.95,0.6,2);
  sp.position.set(0,y-0.05,0); sp.target.position.set(0,0,0); g.add(sp); g.add(sp.target);
  sp.userData.base=2.2; FIXTURE_LIGHTS.push(sp);
  return g;}

function addLabel(text,x,y,z){
  const c=document.createElement('canvas'); c.width=256; c.height=76;
  const g=c.getContext('2d');
  g.fillStyle='rgba(45,45,48,0.72)';
  const r=16,w=246,h=60,ox=5,oy=8;
  g.beginPath();
  g.moveTo(ox+r,oy); g.lineTo(ox+w-r,oy); g.arcTo(ox+w,oy,ox+w,oy+r,r);
  g.lineTo(ox+w,oy+h-r); g.arcTo(ox+w,oy+h,ox+w-r,oy+h,r);
  g.lineTo(ox+r,oy+h); g.arcTo(ox,oy+h,ox,oy+h-r,r);
  g.lineTo(ox,oy+r); g.arcTo(ox,oy,ox+r,oy,r); g.fill();
  g.fillStyle='#fff'; g.font='26px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text,128,39);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  sp.scale.set(1.5,0.45,1); sp.position.set(x,y,z); labelGrp.add(sp);
}

const cSkyDusk=new THREE.Color(0xf0c39a), cSkyNight=new THREE.Color(0x151c2b);
let exposure=1;
function applyTime(t){
  const ang=(t-6)/12*Math.PI;
  const elev=Math.sin(ang);
  const day=Math.max(0,Math.min(1,elev*2.2+0.12));
  const dusk=Math.max(0,1-Math.abs(elev-0.12)/0.3)*((t>4&&t<20.5)?1:0);
  const night=Math.max(0,Math.min(1,-elev*2.6+0.35));
  sun.visible=elev>0.02;
  if(sun.visible){
    sun.position.set(Math.cos(ang)*35,Math.max(3,elev*45),14+Math.sin(ang)*22);
    const warm=Math.max(0,1-elev*1.8);
    sun.color.copy(cDaySun).lerp(cLowSun,Math.min(1,warm));
    sun.intensity=1.6*day*(0.55+0.45*elev)+dusk*0.8;
  }
  hemi.intensity=0.32*day+0.07+dusk*0.08;
  hemi.color.setHex(0xf0f4f8).lerp(cSkyDusk,dusk*0.55).lerp(cSkyNight,night*0.8);
  hemi.groundColor.setHex(0xcfc8bc).lerp(new THREE.Color(0x181b22),night*0.85);
  fill.intensity=0.03*day+0.03;
  scene.environment&&(function(){})();
  const on=Math.max(Math.pow(night,1.1),dusk*0.55);
  const envK=0.08+0.92*day;
  ENV_MATS.forEach(function(m){m.envMapIntensity=m.userData.envBase*envK;});
  nightLights.forEach(function(l){l.intensity=l.userData.base*Math.pow(night,1.3);});
  FIXTURE_LIGHTS.forEach(function(l){l.intensity=l.userData.base*on;});
  FIXTURE_GLOW.forEach(function(m){m.emissiveIntensity=0.25+on*3.2;});
  bMat.emissive.setRGB(0.32*night,0.26*night,0.15*night);
  bMat2.emissive.setRGB(0.3*night,0.25*night,0.16*night);
  // 実写の眺望に時間帯の色をのせる
  const vc=new THREE.Color(0.92,0.92,0.92)
    .lerp(new THREE.Color(1.0,0.66,0.45),dusk*0.85)
    .lerp(new THREE.Color(0.1,0.13,0.22),night*0.92);
  viewMat.color.copy(vc);
  const top=new THREE.Color(0x8fb0cf).lerp(new THREE.Color(0x6e5a7a),dusk*0.8).lerp(new THREE.Color(0x0c1322),night*0.95);
  const hor=new THREE.Color(0xe9e9e4).lerp(new THREE.Color(0xf2b06e),dusk*0.9).lerp(new THREE.Color(0x232c3e),night*0.95);
  (function(){const g=skyC.getContext('2d');
    const gr=g.createLinearGradient(0,0,0,512);
    gr.addColorStop(0,'#'+top.getHexString());
    gr.addColorStop(0.7,'#'+top.clone().lerp(hor,0.6).getHexString());
    gr.addColorStop(1,'#'+hor.getHexString());
    g.fillStyle=gr;g.fillRect(0,0,16,512);})();
  skyTex.needsUpdate=true;
  scene.fog.color.copy(hor);
  exposure=0.72+day*0.1+night*0.25;
}
let timeNow=13, timeGoal=13;
document.querySelectorAll('.chip[data-t]').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.chip[data-t]').forEach(function(x){x.classList.toggle('on',x===b);});
    timeGoal=+b.getAttribute('data-t');
  });
});
applyTime(timeNow);

/* ---- ポストプロセス(ブルーム+トーンマップ+色味) ---- */
const rt=new THREE.WebGLRenderTarget(window.innerWidth,window.innerHeight,{type:THREE.HalfFloatType});
const composer=new THREE.EffectComposer(renderer,rt);
composer.setPixelRatio(renderer.getPixelRatio());
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.35,0.55,0.9);
composer.addPass(bloom);
const FinalShader={ // r128 はレンダーターゲットにもトーンマップを掛けるので、ここでは sRGB 変換と色味だけ
  uniforms:{tDiffuse:{value:null},tint:{value:new THREE.Vector3(1.0,0.985,0.96)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform vec3 tint;varying vec2 vUv;\nvec3 uwSRGB(vec3 c){c=max(c,0.0);return mix(pow(c,vec3(0.41666))*1.055-0.055,c*12.92,vec3(lessThanEqual(c,vec3(0.0031308))));}\nvoid main(){vec3 c=texture2D(tDiffuse,vUv).rgb*tint;c=uwSRGB(c);c=(c-0.5)*1.06+0.5;gl_FragColor=vec4(c,1.0);}'
};
const finalPass=new THREE.ShaderPass(FinalShader);
composer.addPass(finalPass);

/* ---- フィルムグレイン(CSS重ね) ---- */

function drawGrain(){
  const d=grainData.data;

}

/* ================= カメラの道すじ(スクロールで進む) ================= */
// p:カメラ位置 l:注視点 f:画角 card:説明カード(なし=通過点)

const STOPS=[
  {p:V3(4.4,15.5,14.5),l:V3(4.4,0,3.9),f:36,card:{no:'00',en:'Santorini Chic',jp:'2LDK ・ 高層階 ・ 8.8m × 7.35m',

  {p:V3(3.05,1.5,0.73),l:V3(4.6,1.4,0.9),f:62},

  {p:V3(3.8,1.42,6.5),l:V3(7.4,1.25,4.3),f:66,card:{no:'04',en:'Living',jp:'リビング',
    txt:'ソファから TV と眺望の両方を見渡せる配置。天井には放射状に光が伸びるシーリングライト。',
    li:[{t:'KOVOL LED シーリングライト 7頭(ホワイト枠)',pick:1},{t:'ニトリ Nビリーバ3 電動リクライニングソファ W2100',pick:1},{t:'TVスタンド 50インチ',pick:1},'コーヒーテーブル φ900 ・ 白ブークレのチェア']}},

    txt:'セラミック天板のテーブルの上に、波を描く LED ペンダント。夜は食卓だけをやわらかく照らす。',
    li:[{t:'ウェーブ型 LED ペンダント(ブラック)',pick:1},{t:'LOWYA トミック セラミックDT W1600',pick:1},{t:'トミックチェア ×4(ファブリックグレー)',pick:1}]}},

    txt:'窓の外は、実際にこの部屋から撮った写真。地平線まで抜ける景色を、時間帯を変えて見られます。',li:['右上のボタンで 昼・夕景・夜 を切替','写真:LD の窓から撮影']}},

    txt:'昇降デスクは南窓向き。眺望を前に在宅ワーク。引戸を閉めればオンとオフを切り替えられる。',
    li:['昇降デスク W1200(電動)＋27型モニター',{t:'キューブシェルフ 2×3(ホワイト)',pick:1},'ローシェルフ W1400 ・ フロアランプ']}},
  {p:V3(5.4,1.5,6.7),l:V3(5.6,1.3,9.5),f:62},
  {p:V3(7.4,1.45,8.45),l:V3(2.5,1.05,11.5),f:64,card:{no:'08',en:'Balcony',jp:'バルコニー',
    txt:'アウトドアラウンジャーを並べて、夕景を眺める席に。',li:['アウトドアラウンジャー ×2 ・ サイドテーブル','オリーブの鉢']}},
  {p:V3(4.4,6.5,17),l:V3(4.4,0.8,3.7),f:40},
  {p:V3(13.5,13,12.5),l:V3(4.4,0,3.7),f:36,card:{no:'09',en:'Whole Plan',jp:'全体',
    txt:'もう一度スクロールを戻せば、どの部屋にも戻れます。右側の点からも移動できます。',li:['昼・夕景・夜で照明の見え方を比べられる','ドラッグで視点を少し動かせる']}}
];
const posCurve=new THREE.CatmullRomCurve3(STOPS.map(function(s){return s.p;}),false,'centripetal');
const lookCurve=new THREE.CatmullRomCurve3(STOPS.map(function(s){return s.l;}),false,'centripetal');
// スクロール量の割り当て(カードの場所では少し止まる)
const SEG=[]; let total=0;
STOPS.forEach(function(s,i){
  const dwell=s.card?0.9:0;
  SEG.push({i:i,a:total,dwell:dwell}); total+=dwell;
  if(i<STOPS.length-1){
    const d=s.p.distanceTo(STOPS[i+1].p);
    const tr=Math.min(1.1,Math.max(0.35,d*0.12));
    SEG[i].tr=tr; total+=tr;
  }
});
const scroller=document.getElementById('scroller');
scroller.style.height=(total*100+100)+'vh';
function uFromProgress(s){ // s:0..total → 曲線上の位置 0..1
  const n=STOPS.length-1;
  for(let k=0;k<SEG.length;k++){
    const g=SEG[k];
    if(s<g.a+g.dwell) return {u:g.i/n,card:STOPS[g.i].card?g.i:-1};
    if(g.tr!==undefined && s<g.a+g.dwell+g.tr){
      const t=(s-g.a-g.dwell)/g.tr;
      const e=t*t*(3-2*t);
      return {u:(g.i+e)/n,card:-1};
    }
  }
  return {u:1,card:STOPS.length-1};
}
function fovAt(u){
  const n=STOPS.length-1, x=u*n, i=Math.min(n-1,Math.floor(x)), t=x-i;
  return STOPS[i].f+(STOPS[i+1].f-STOPS[i].f)*t;
}

/* ---- カード・目次 ---- */
const cardEl=document.getElementById('card'), railEl=document.getElementById('rail');
let shownCard=-2;
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function showCard(i){
  if(i===shownCard)return; shownCard=i;
  if(i<0||STOPS[i].title){cardEl.classList.add('hide');}
  else{
    const c=STOPS[i].card;
    cardEl.innerHTML='<div class="no">'+c.no+'</div><h2>'+esc(c.en)+'</h2><div class="jp">'+esc(c.jp)+'</div><p>'+esc(c.txt)+'</p><ul>'+
      c.li.map(function(x){return typeof x==='string'?'<li>'+esc(x)+'</li>':'<li class="pick">'+esc(x.t)+'</li>';}).join('')+'</ul>';
    cardEl.classList.remove('hide');
  }
  railEl.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
}
SEG.forEach(function(g){
  const s=STOPS[g.i]; if(!s.card)return;
  const b=document.createElement('button'); b.dataset.i=g.i; b.setAttribute('aria-label',s.card.jp);
  b.innerHTML='<span>'+esc(s.card.jp.split(' ・ ')[0].split(' ')[0])+'</span>';
  b.onclick=function(){stopAuto();window.scrollTo({top:(g.a+g.dwell*0.45)*window.innerHeight,behavior:'smooth'});};
  railEl.appendChild(b);
});

/* ---- 自動再生 ---- */
let auto=false;
const playBtn=document.getElementById('play');
function stopAuto(){auto=false;playBtn.classList.remove('on');playBtn.textContent='▶ 自動再生';}
playBtn.onclick=function(){
  auto=!auto; playBtn.classList.toggle('on',auto); playBtn.textContent=auto?'❚❚ 停止':'▶ 自動再生';
  if(auto&&window.scrollY>=document.documentElement.scrollHeight-window.innerHeight-4)window.scrollTo(0,0);
};
window.addEventListener('wheel',function(){if(auto)stopAuto();},{passive:true});
window.addEventListener('touchstart',function(){if(auto)stopAuto();},{passive:true});

/* ---- ドラッグで少し見回す ---- */
const look={yaw:0,pitch:0,dragging:false,x:0,y:0};
renderer.domElement.addEventListener('pointerdown',function(e){look.dragging=true;look.x=e.clientX;look.y=e.clientY;});
window.addEventListener('pointerup',function(){look.dragging=false;});
window.addEventListener('pointermove',function(e){
  if(!look.dragging)return;
  look.yaw=Math.max(-1.1,Math.min(1.1,look.yaw-(e.clientX-look.x)*0.004));
  look.pitch=Math.max(-0.5,Math.min(0.5,look.pitch-(e.clientY-look.y)*0.003));
  look.x=e.clientX; look.y=e.clientY;
});

/* ================= ループ ================= */
const clock=new THREE.Clock();
let sCur=0, frame=0;
const tmpDir=new THREE.Vector3(), tmpL=new THREE.Vector3(), upV=new THREE.Vector3(0,1,0);
const titleEl=document.getElementById('title'), barEl=document.getElementById('bar'), hintEl=document.getElementById('hint');
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(auto){
    window.scrollBy(0,window.innerHeight*0.075*dt*4);
    if(window.scrollY>=document.documentElement.scrollHeight-window.innerHeight-2)stopAuto();
  }
  const sGoal=window.scrollY/window.innerHeight;
  sCur+=(sGoal-sCur)*(1-Math.exp(-dt*3.2));                 // なめらかスクロール
  const r=uFromProgress(Math.min(total,sCur));
  const u=r.u;
  camera.position.copy(posCurve.getPoint(u));
  tmpL.copy(lookCurve.getPoint(u));
  // ゆるい手ぶれ(シネマ感)
  const tt=clock.elapsedTime;
  camera.position.x+=Math.sin(tt*0.6)*0.01; camera.position.y+=Math.sin(tt*0.83)*0.008;
  // ドラッグの見回し(離すと戻る)
  if(!look.dragging){look.yaw*=Math.exp(-dt*1.4);look.pitch*=Math.exp(-dt*1.4);}
  tmpDir.copy(tmpL).sub(camera.position);
  tmpDir.applyAxisAngle(upV,look.yaw);
  const side=new THREE.Vector3().crossVectors(tmpDir,upV).normalize();
  tmpDir.applyAxisAngle(side,look.pitch);
  camera.lookAt(tmpL.copy(camera.position).add(tmpDir));
  const f=fovAt(u);
  if(Math.abs(camera.fov-f)>0.01){camera.fov=f;camera.updateProjectionMatrix();}
  const inside=camera.position.y<2.6;
  ceilGrp.visible=inside;
  balcGrp.children[balcGrp.children.length-1].visible=inside; // 上階バルコニー底
  showCard(r.card);
  titleEl.style.opacity=Math.max(0,1-sCur*1.6);
  hintEl.style.opacity=Math.max(0,1-sCur*3);
  barEl.style.width=(Math.min(1,sCur/total)*100)+'%';
  // 時間帯をなめらかに
  if(Math.abs(timeGoal-timeNow)>0.01){timeNow+=(timeGoal-timeNow)*(1-Math.exp(-dt*2.2));applyTime(timeNow);}
  renderer.toneMappingExposure=exposure;
  if((frame++&1)===0)drawGrain();
  composer.render();
}
animate();
setTimeout(function(){const it=document.getElementById('intro');it.classList.add('gone');setTimeout(function(){it.style.display='none';},1400);},700);

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  composer.setSize(window.innerWidth,window.innerHeight);
});
